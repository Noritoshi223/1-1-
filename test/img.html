<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>フォトビューア</title>
  <!-- ホーム画面追加用アイコン設定 -->
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #preview {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
    #placeholder {
      color: #444444;
      font-family: sans-serif;
      font-size: 14px;
      user-select: none;
    }
    #fileInput {
      display: none;
    }
  </style>
</head>
<body onclick="document.getElementById('fileInput').click()">

  <div id="placeholder">画面をタップして画像を選択</div>
  <img id="preview" alt="">
  <input type="file" id="fileInput" accept="image/*">

  <script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const placeholder = document.getElementById('placeholder');

    // IndexedDBの初期化
    const openDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('FullImageAppDB', 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('settings')) {
            db.createObjectStore('settings');
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    // 画像の保存
    const saveImage = async (blob) => {
      const db = await openDB();
      const tx = db.transaction('settings', 'readwrite');
      tx.objectStore('settings').put(blob, 'saved_image');
      return tx.complete;
    };

    // 画像の読み込み
    const loadImage = async () => {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction('settings', 'readonly');
        const req = tx.objectStore('settings').get('saved_image');
        req.onsuccess = () => resolve(req.result);
      });
    };

    // 保存済み画像の表示
    window.addEventListener('DOMContentLoaded', async () => {
      const savedBlob = await loadImage();
      if (savedBlob) {
        preview.src = URL.createObjectURL(savedBlob);
        preview.style.display = 'block';
        placeholder.style.display = 'none';
      }
    });

    // 画像変更
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      await saveImage(file);
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      placeholder.style.display = 'none';
    });

    // PWA設定 (Manifest & Service Worker)
    // アイコン画像ファイルパス: icon.png
    const ICON_URL = "icon.png";

    const manifest = {
      name: "フォト表示",
      short_name: "フォト",
      start_url: "./",
      display: "standalone",
      background_color: "#000000",
      theme_color: "#000000",
      icons: [
        {
          src: ICON_URL,
          sizes: "192x192",
          type: "image/png"
        },
        {
          src: ICON_URL,
          sizes: "512x512",
          type: "image/png"
        }
      ]
    };
    
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(link);

    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(swBlob));
    }
  </script>
</body>
</html>
